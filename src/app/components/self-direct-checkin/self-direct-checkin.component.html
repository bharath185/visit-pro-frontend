<div class="fade-in">
  <div class="page-header">
    <nz-breadcrumb>
      <nz-breadcrumb-item><a routerLink="/"><i nz-icon nzType="home"></i></a></nz-breadcrumb-item>
      <nz-breadcrumb-item>Walk-In Check-In</nz-breadcrumb-item>
    </nz-breadcrumb>
    <h2>Walk-In Check-In</h2>
  </div>

  <nz-row [nzGutter]="[16,16]">
    <nz-col [nzXs]="24" [nzSm]="18" [nzMd]="12">
      <nz-card nzTitle="Self Check-In (Walk-in)">
        <div *ngIf="!checkedIn">
          <div nz-row [nzGutter]="[16,0]">
            <div nz-col [nzXs]="24" [nzSm]="12">
              <div class="form-section">
                <label class="form-section-label">Full Name <span class="text-danger">*</span></label>
                <input nz-input [(ngModel)]="model.Name" name="name" autofocus>
              </div>
            </div>
            <div nz-col [nzXs]="24" [nzSm]="12">
              <div class="form-section">
                <label class="form-section-label">Designation</label>
                <input nz-input [(ngModel)]="model.Designation" name="designation">
              </div>
            </div>
            <div nz-col [nzXs]="24" [nzSm]="12">
              <div class="form-section">
                <label class="form-section-label">Company</label>
                <input nz-input [(ngModel)]="model.Company" name="company">
              </div>
            </div>
            <div nz-col [nzXs]="24" [nzSm]="12">
              <div class="form-section">
                <label class="form-section-label">Purpose</label>
                <input nz-input [(ngModel)]="model.Purpose" name="purpose">
              </div>
            </div>
            <div nz-col [nzXs]="24" [nzSm]="12">
              <div class="form-section">
                <label class="form-section-label">Email <span class="text-danger">*</span></label>
                <input nz-input [(ngModel)]="model.PMail" name="email" type="email" required>
              </div>
            </div>
            <div nz-col [nzXs]="24" [nzSm]="12">
              <div class="form-section">
                <label class="form-section-label">Mobile</label>
                <input nz-input [(ngModel)]="model.Mobile" name="mobile" pattern="[6-9]\d{9}" maxlength="10" title="Enter a valid 10-digit mobile number">
              </div>
            </div>
            <div nz-col [nzXs]="24" [nzSm]="12">
              <div class="form-section">
                <label class="form-section-label">Alternate Mobile</label>
                <input nz-input [(ngModel)]="model.AMobile" name="amobile" pattern="[6-9]\d{9}" maxlength="10" title="Enter a valid 10-digit mobile number">
              </div>
            </div>
            <div nz-col [nzXs]="24" [nzSm]="12">
              <div class="form-section">
                <label class="form-section-label">Contact Person</label>
                <nz-select [(ngModel)]="model.WhomtoMeet" name="whomtomeet" nzPlaceHolder="-- Select --">
                  <nz-option *ngFor="let e of employees" [nzLabel]="e.Name" [nzValue]="e.Id"></nz-option>
                </nz-select>
              </div>
            </div>
            <div nz-col [nzXs]="24" [nzSm]="12">
              <div class="form-section">
                <label class="form-section-label">ID Card <span class="text-danger">*</span></label>
                <input nz-input [(ngModel)]="model.IdCard" name="idcard" required>
              </div>
            </div>
            <div nz-col [nzXs]="24" [nzSm]="12">
              <div class="form-section">
                <label class="form-section-label">Accessories</label>
                <input nz-input [(ngModel)]="model.Accessories" name="accessories">
              </div>
            </div>
            <div nz-col [nzXs]="24" [nzSm]="12">
              <div class="form-section">
                <label class="form-section-label">Date</label>
                <input nz-input [(ngModel)]="model.Date" name="date" type="date" [min]="today">
              </div>
            </div>
            <div nz-col [nzXs]="24" [nzSm]="12">
              <div class="form-section">
                <label class="form-section-label">Time</label>
                <input nz-input [(ngModel)]="model.Time" name="time" type="time">
              </div>
            </div>
          </div>
          <div class="d-flex gap-2 mt-3">
            <button nz-button nzType="primary" (click)="submit()" [nzLoading]="loading">
              <i nz-icon nzType="check-circle"></i> Check In
            </button>
          </div>
        </div>

        <div *ngIf="checkedIn" class="wizard-center">
          <i nz-icon nzType="check-circle" nzTheme="outline" style="font-size:48px;color:var(--success);margin-bottom:16px;display:block"></i>
          <h4 style="margin:12px 0;color:var(--primary)">Check-In Successful!</h4>
          <div style="background:var(--bg-light);border-radius:8px;padding:16px;margin-top:12px">
            <p class="mb-1"><strong>Check-In Code:</strong> <span class="text-primary" style="font-size:18px;font-weight:700">{{ checkInCode }}</span></p>
            <p class="text-muted mb-0" style="font-size:13px">Please show this code at the reception if needed.</p>
          </div>
          <div class="mt-3">
            <button nz-button nzType="default" (click)="reset()">
              <i nz-icon nzType="plus"></i> New Check-In
            </button>
          </div>
        </div>
      </nz-card>
    </nz-col>
  </nz-row>
</div>
